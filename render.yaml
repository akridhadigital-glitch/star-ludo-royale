# Render Blueprint: game server + Postgres + Redis (Key Value).
# Render dashboard → New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: star-ludo-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free            # sleeps when idle; switch to "starter" to keep it always on
    region: singapore     # closest Render region to India
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: star-ludo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: star-ludo-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: TURN_SECONDS
        value: "15"

  - type: keyvalue
    name: star-ludo-redis
    plan: free
    region: singapore
    ipAllowList: []       # reachable only from your Render services

databases:
  - name: star-ludo-db
    plan: free
    region: singapore
    databaseName: ludo
    user: ludo
