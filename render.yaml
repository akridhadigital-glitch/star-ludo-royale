# Render Blueprint — free forever setup:
#   • Game server: Render free web service (sleeps after 15 min idle, ~1 min to wake)
#   • Database:    Neon free Postgres (no expiry) — paste its connection string when Render asks
#   • No Redis:    live rooms are kept in the server's memory (fine for one server)
# Render dashboard → New → Blueprint → pick this repo → fill DATABASE_URL → Apply.
services:
  - type: web
    name: star-ludo-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Render asks for this: your Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: TURN_SECONDS
        value: "15"
