name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ludo, POSTGRES_PASSWORD: ludo, POSTGRES_DB: ludo_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ludo" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://ludo:ludo@localhost:5432/ludo_test
          TEST_REDIS_URL: redis://localhost:6379
      - run: npm run build
      - name: Docker image builds
        run: docker build -t star-ludo-royale-server .

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter --version
      - name: Create platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name star_ludo_royale --org com.starludoroyale --platforms android,ios
            git checkout -- test lib pubspec.yaml 2>/dev/null || true
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          code=0
          flutter analyze --no-fatal-infos 2>&1 | tee out.txt || code=$?
          if [ "$code" != "0" ]; then
            msg=$(grep -E "error|warning" out.txt | head -80 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -z "$msg" ] && msg=$(tail -60 out.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter analyze::$msg"
          fi
          exit $code
      - name: Test
        run: |
          set -o pipefail
          code=0
          flutter test --reporter expanded 2>&1 | tee out.txt || code=$?
          if [ "$code" != "0" ]; then
            msg=$(grep -E "Error|error|Expected|Actual|FAILED|failed|\\[E\\]" out.txt | head -80 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -z "$msg" ] && msg=$(tail -60 out.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter test::$msg"
          fi
          exit $code
      - name: Build release APK
        env:
          API_URL: ${{ vars.API_URL || 'http://10.0.2.2:8080' }}
        run: |
          set -o pipefail
          code=0
          flutter build apk --release --dart-define=API_URL=$API_URL 2>&1 | tee out.txt || code=$?
          if [ "$code" != "0" ]; then
            msg=$(grep -E "rror|FAIL|What went wrong|Exception" out.txt | head -80 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -z "$msg" ] && msg=$(tail -60 out.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter build apk::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v5
        with:
          name: star-ludo-royale-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    needs: app
    if: github.ref == 'refs/heads/main'
    permissions: { contents: write }
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create web platform folder if missing
        run: |
          if [ ! -d web ]; then
            flutter create . --project-name star_ludo_royale --org com.starludoroyale --platforms web
            git checkout -- test lib pubspec.yaml 2>/dev/null || true
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - name: Build web
        env:
          API_URL: ${{ vars.API_URL || 'http://localhost:8080' }}
        run: |
          flutter build web --release --no-web-resources-cdn --pwa-strategy=none --dart-define=API_URL=$API_URL
          cd build/web
          # Serve from any sub-path: drop the absolute <base href>
          sed -i 's#<base href="/">##' index.html
          sed -i 's#<title>.*</title>#<title>Star Ludo Royale</title>#' index.html
      - name: Publish build to web-build branch
        run: |
          cd build/web
          git init -q -b web-build
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "web build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web-build
