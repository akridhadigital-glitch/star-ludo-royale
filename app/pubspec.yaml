name: star_ludo_royale
description: Star Ludo Royale — classic Ludo with smooth play, bots, pass & play and online rooms.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  socket_io_client: ^2.0.3+1
  audioplayers: ^6.1.0
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  url_launcher: ^6.3.1
  share_plus: ">=10.1.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# App icon + launch screen (generated in CI after `flutter create`).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F172A"
  image: assets/icon/splash.png
  android_12:
    color: "#0F172A"
    image: assets/icon/foreground.png
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-subset.ttf
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-subset.ttf
    - family: NotoSansSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-subset.ttf
